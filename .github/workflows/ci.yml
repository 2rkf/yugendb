name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    uses: ./.github/workflows/rust.yml

  node:
    name: Node.js checks
    uses: ./.github/workflows/node.yml
